name: ci

# Every push and pull request is checked. On a push to main the image is also
# built and published to GHCR, so the server that runs it only ever pulls:
# it never needs a Node toolchain or a clone of this repository.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 24, matching the image. The server runs its TypeScript directly with
      # Node's type stripping, which older versions don't have.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test

      # The image builds this too; doing it here fails faster and names the file.
      - run: npm run build

      # A high-severity advisory is a failed build, not a line of output to
      # notice: this server holds marketplace credentials and may face the
      # internet. `high` rather than `moderate`, so the gate isn't tripped by
      # every transitive dev-tool advisory.
      - run: npm audit --audit-level=high

  image:
    runs-on: ubuntu-latest
    needs: checks
    # Only main is published; a pull request just proves the image builds.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Sign in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          # Reported by /api/health, so a deploy can be checked against the commit.
          build-args: |
            GIT_SHA=${{ github.sha }}
          push: ${{ github.ref == 'refs/heads/main' }}
          # latest for the ordinary deploy; the SHA to roll back to.
          tags: |
            ghcr.io/aidan-kay/listingwatch-web:${{ github.sha }}
            ghcr.io/aidan-kay/listingwatch-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
