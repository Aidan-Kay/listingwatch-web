# ListingWatch as its own Compose stack. Copy this file and .env.example into a
# folder on the server (for example ~/listingwatch), rename the latter to .env,
# fill it in, then: docker compose pull && docker compose up -d
#
# The image is built and published by CI on every push to main (see
# .github/workflows/ci.yml); the server only pulls it.
services:
  listingwatch:
    # `latest` for the ordinary case. To roll back, pin a commit SHA instead
    # (CI tags every build with both), then pull and up again.
    image: ghcr.io/aidan-kay/listingwatch-web:latest
    container_name: listingwatch
    restart: unless-stopped
    init: true
    env_file: .env
    # Loopback only: the reverse proxy is the way in.
    ports:
      - "127.0.0.1:8095:8095"
    volumes:
      - ./data:/data
    # Chromium uses shared memory for its renderers.
    shm_size: "512m"
